[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nnws"
version = "0.1.0"
description = "Neural Network Weighting Stacking for seismic cross-correlation functions"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.23",
  "torch>=2.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
figures = [
  "matplotlib>=3.7",
  "obspy>=1.4",
  "pandas>=2.0",
  "scipy>=1.10",
  "seaborn>=0.13",
]
test = ["pytest>=7"]
dev = ["nnws[figures,test]", "jupyterlab>=4"]

[project.scripts]
nnws-figures = "nnws.figures:main"

[project.urls]
Repository = "https://github.com/Guiqifan/A-Neural-Network-Weighting-Stacking-method-for-cross-correlation-functions"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
